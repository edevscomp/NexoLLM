name: Multiplatform CI (macOS, Windows, Linux)

on:
  workflow_dispatch:

jobs:
  core-and-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run shared nexollm-core unit tests
        working-directory: platforms
        run: cargo test -p nexollm-core
      - name: Check Linux adapter & desktop host
        working-directory: platforms
        run: cargo check --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run shared nexollm-core unit tests
        working-directory: platforms
        run: cargo test -p nexollm-core
      - name: Check Windows 10/11 adapter & desktop host
        working-directory: platforms
        run: cargo check --workspace
