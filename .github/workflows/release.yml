name: Multi-OS Release Packaging

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach Windows & Linux installers to (e.g. v0.9.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows x64 Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms
      - name: Build release binary
        working-directory: platforms
        run: |
          cargo test -p nexollm-core
          cargo build --release --workspace
      - name: Package Windows NSIS Setup (.exe)
        shell: pwsh
        run: |
          $Ver = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python -m pip install --quiet pillow
          python -c "from PIL import Image; im = Image.open('showcase/assets/icon.png').convert('RGBA'); im.save('NexoLLM.ico', sizes=[(256,256),(64,64),(48,48),(32,32),(16,16)])"
          .\platforms\target\release\nexollm-desktop.exe --selftest
          $Makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $Makensis "-DVERSION=$Ver" "-DBIN_PATH=$PWD\platforms\target\release\nexollm-desktop.exe" "-DICON_FILE=$PWD\NexoLLM.ico" "-DOUTFILE=$PWD\artifacts\NexoLLM-windows-x64-setup.exe" "$PWD\platforms\windows\installer.nsi"
          Get-Item artifacts\NexoLLM-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/NexoLLM-windows-x64-setup.exe

  linux-packages:
    name: Build Linux Packages (.AppImage & .deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libssl-dev pkg-config build-essential file curl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms
      - name: Build release binary
        working-directory: platforms
        run: |
          cargo test -p nexollm-core
          cargo build --release --workspace
      - name: Package .deb and .AppImage
        run: |
          set -euo pipefail
          VER="$(tr -d '[:space:]' < VERSION)"
          mkdir -p artifacts
          BIN="platforms/target/release/nexollm-desktop"
          "$BIN" --selftest
          strip "$BIN" || true

          # 1. Debian / Ubuntu .deb
          DEB_ROOT="build_deb/NexoLLM-linux-amd64"
          mkdir -p "$DEB_ROOT/DEBIAN" \
                   "$DEB_ROOT/usr/bin" \
                   "$DEB_ROOT/usr/share/applications" \
                   "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps" \
                   "$DEB_ROOT/usr/share/metainfo"
          cp "$BIN" "$DEB_ROOT/usr/bin/nexollm"
          chmod 0755 "$DEB_ROOT/usr/bin/nexollm"
          cp platforms/linux/nexollm.desktop "$DEB_ROOT/usr/share/applications/nexollm.desktop"
          cp showcase/assets/icon.png "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/nexollm.png"
          cp platforms/linux/org.edevs.NexoLLM.metainfo.xml "$DEB_ROOT/usr/share/metainfo/"
          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: nexollm
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Maintainer: EdevS <https://github.com/edevscomp/NexoLLM>
          Homepage: https://github.com/edevscomp/NexoLLM
          Description: NexoLLM — On-device AI writing assistant
           Inline autocomplete, writing tools and instant lookup for every app on your computer.
           100% on-device AI powered by llama.cpp and whisper.cpp.
          EOF
          sed -i 's/^          //' "$DEB_ROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DEB_ROOT" artifacts/NexoLLM-linux-amd64.deb

          # 2. Portable x86_64 AppImage
          APPDIR="build_appimage/AppDir"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/metainfo"
          cp "$BIN" "$APPDIR/usr/bin/nexollm"
          chmod 0755 "$APPDIR/usr/bin/nexollm"
          cp platforms/linux/nexollm.desktop "$APPDIR/nexollm.desktop"
          cp platforms/linux/nexollm.desktop "$APPDIR/usr/share/applications/nexollm.desktop"
          cp showcase/assets/icon.png "$APPDIR/nexollm.png"
          cp showcase/assets/icon.png "$APPDIR/.DirIcon"
          cp showcase/assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/nexollm.png"
          cp platforms/linux/org.edevs.NexoLLM.metainfo.xml "$APPDIR/usr/share/metainfo/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/nexollm" "$@"
          EOF
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod 0755 "$APPDIR/AppRun"

          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" artifacts/NexoLLM-linux-x86_64.AppImage
          chmod 0755 artifacts/NexoLLM-linux-x86_64.AppImage
          ls -lh artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            artifacts/NexoLLM-linux-x86_64.AppImage
            artifacts/NexoLLM-linux-amd64.deb

  publish-assets:
    name: Attach Installers & Update SHA256SUMS
    needs: [windows-installer, linux-packages]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download built Windows & Linux installers
        uses: actions/download-artifact@v4
        with:
          path: release_upload
          merge-multiple: true
      - name: Upload installers to GitHub Release & refresh SHA256SUMS.txt
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "Attaching Windows & Linux installers to release $TAG..."
          cd release_upload
          gh release download "$TAG" --pattern "NexoLLM-macos.dmg" --clobber || true
          sha256sum NexoLLM-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" \
            NexoLLM-windows-x64-setup.exe \
            NexoLLM-linux-x86_64.AppImage \
            NexoLLM-linux-amd64.deb \
            SHA256SUMS.txt \
            --clobber
