[package]
name = "nexollm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native desktop host (tao + wry WebView2 / WebKitGTK) bridging nexollm-core with Windows 10/11 and Linux adapters"

[[bin]]
name = "nexollm-desktop"
path = "src/main.rs"

[dependencies]
nexollm-core = { path = "../../core" }
serde.workspace = true
serde_json.workspace = true
tao = "0.30"
wry = "0.47"

[target.'cfg(target_os = "windows")'.dependencies]
nexollm-windows = { path = "../../windows" }

[target.'cfg(target_os = "linux")'.dependencies]
nexollm-linux = { path = "../../linux" }
