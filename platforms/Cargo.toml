[workspace]
resolver = "2"
members = [
    "core",
    "windows",
    "linux",
    "ui/src-tauri",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["EdevS"]
repository = "https://github.com/edevscomp/NexoLLM"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["std"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
